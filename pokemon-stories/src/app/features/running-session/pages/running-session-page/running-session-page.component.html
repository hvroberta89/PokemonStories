<main class="running-session-page">
  <div class="running-session-page__background"></div>

  <header class="session-header">
    <button
      type="button"
      class="session-header__menu"
      aria-label="Menü megnyitása"
    >
      <span aria-hidden="true">☰</span>
    </button>

    <nav
      class="session-header__breadcrumbs"
      aria-label="Navigációs útvonal"
    >
      <span class="session-header__brand">
        Pokémon kalandok
      </span>

      <span
        class="session-header__separator"
        aria-hidden="true"
      >
        ›
      </span>

      <span class="session-header__campaign">
        Az eltűnt Napviráglevél
      </span>

      <span
        class="session-header__separator"
        aria-hidden="true"
      >
        ›
      </span>

      <strong class="session-header__location">
        {{ viewModel().story.locationName }}
      </strong>
    </nav>

    <button
      type="button"
      class="session-header__notes"
      aria-label="Jegyzetek megnyitása"
    >
      <span aria-hidden="true">📝</span>
      <span class="session-header__notification">
        2
      </span>
    </button>
  </header>

  <section
    class="session-meta"
    aria-label="Kaland állapota"
  >
    <span class="session-meta__type">
      <span aria-hidden="true">🌿</span>
      Felfedezés
    </span>

    <div
      class="session-meta__progress"
      aria-label="Kaland előrehaladása"
    >
      <span class="session-meta__step session-meta__step--completed"></span>
      <span class="session-meta__line session-meta__line--completed"></span>

      <span class="session-meta__step session-meta__step--completed"></span>
      <span class="session-meta__line session-meta__line--completed"></span>

      <span class="session-meta__step session-meta__step--active"></span>
      <span class="session-meta__line"></span>

      <span class="session-meta__step"></span>
      <span class="session-meta__line"></span>

      <span class="session-meta__step"></span>
    </div>

    <span class="session-meta__timer">
      <span aria-hidden="true">⏱</span>
      00:42:15
    </span>
  </section>

  <section class="running-session-page__content">
    <section
      class="running-session-page__story"
      aria-label="Aktuális történet"
    >
      <app-story-card
        [story]="viewModel().story"
      />
    </section>

    <section
      class="running-session-page__goal"
      aria-label="Aktuális cél"
    >
      <app-goal-card
        [goal]="viewModel().goal"
        (actionSelected)="openGoalDetails()"
      />
    </section>

    <section
      class="running-session-page__characters"
      aria-label="Kalandorok"
    >
      <app-characters-strip
        [strip]="viewModel().characters"
        (characterSelected)="selectCharacter($event)"
        (addSelected)="addCharacter()"
        (detailsSelected)="openCharacterDetails()"
      />
    </section>

    <section
      class="running-session-page__assistant"
      aria-label="Mesélői segítség"
    >
      <app-improv-assistant
        [assistant]="viewModel().assistant"
        (actionSelected)="selectAssistantAction($event)"
      />
    </section>
  </section>

  <button
    type="button"
    class="quick-action-button"
    aria-label="Gyors művelet"
  >
    <span aria-hidden="true">+</span>
  </button>

  <div class="running-session-page__dock">
    <app-quick-dock
      (actionSelected)="selectQuickAction($event)"
    />
  </div>
</main>
