<nav
  class="quick-dock"
  aria-label="Kaland gyorsműveletek"
>
  @for (
    item of dock().items;
    track item.action
  ) {
    <button
      type="button"
      class="quick-dock__item"
      [class.quick-dock__item--active]="item.active"
      [attr.data-action]="item.action"
      [attr.aria-label]="item.label"
      (click)="selectAction(item.action)"
    >
      <span class="quick-dock__icon-shell">
        <ps-icon
          class="quick-dock__icon"
          [name]="item.icon"
          [size]="36"
          [glowing]="item.active ?? false"
          [decorative]="true"
        />

        @if (item.badge; as badge) {
          <span
            class="quick-dock__badge"
            aria-hidden="true"
          >
            {{ badge }}
          </span>
        }

        @if (item.action === 'assistant') {
          <span
            class="quick-dock__assistant-status"
            aria-hidden="true"
          ></span>
        }
      </span>

      <span class="quick-dock__label">
        {{ item.label }}
      </span>
    </button>
  }
</nav>
