<article
  class="goal-card"
  [attr.data-status]="goal().status"
>
  <div
    class="goal-card__accent"
    aria-hidden="true"
  ></div>

  <div class="goal-card__icon">
    @switch (goal().status) {
      @case ('completed') {
        <ps-icon
          name="success-check"
          [size]="30"
          [decorative]="true"
        />
      }

      @case ('failed') {
        <ps-icon
          name="warning-triangle"
          [size]="30"
          [decorative]="true"
        />
      }

      @default {
        <ps-icon
          name="goal-target"
          [size]="30"
          [decorative]="true"
        />
      }
    }
  </div>

  <div class="goal-card__content">
    <p class="goal-card__eyebrow">
      Aktuális cél
    </p>

    <h2>
      {{ goal().title }}
    </h2>

    <p class="goal-card__description">
      {{ goal().description }}
    </p>

    @if (goal().progressLabel; as progressLabel) {
      <span class="goal-card__progress">
        {{ progressLabel }}
      </span>
    }
  </div>

  <button
    type="button"
    class="goal-card__action"
    [attr.aria-label]="goal().actionLabel"
    (click)="selectAction()"
  >
    <span class="goal-card__action-icon">
      <ps-icon
        name="exploration-footprints"
        [size]="24"
        [decorative]="true"
      />
    </span>

    <span
      class="goal-card__action-arrow"
      aria-hidden="true"
    >
      ›
    </span>
  </button>
</article>
