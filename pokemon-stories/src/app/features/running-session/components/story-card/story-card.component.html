<article
  class="story-card"
  [attr.data-mood]="story().mood"
>
  <div class="story-card__visual">
    <img
      class="story-card__image"
      [src]="story().imageUrl"
      [alt]="story().imageAlt"
    >

    <div
      class="story-card__visual-overlay"
      aria-hidden="true"
    ></div>
  </div>

  <section class="story-card__page">
    <div
      class="story-card__inner-frame"
      aria-hidden="true"
    ></div>

    <span
      class="story-card__corner story-card__corner--top-left"
      aria-hidden="true"
    ></span>

    <span
      class="story-card__corner story-card__corner--top-right"
      aria-hidden="true"
    ></span>

    <span
      class="story-card__corner story-card__corner--bottom-left"
      aria-hidden="true"
    ></span>

    <span
      class="story-card__corner story-card__corner--bottom-right"
      aria-hidden="true"
    ></span>

    <header class="story-card__header">
      <span class="story-card__location-icon">
        <ps-icon
          [name]="story().locationIcon"
          [size]="38"
          [decorative]="true"
        />
      </span>

      <h2>
        {{ story().locationName }}
      </h2>
    </header>

    <div
      class="story-card__divider"
      aria-hidden="true"
    >
      <span></span>
      <i></i>
      <span></span>
    </div>

    <div class="story-card__narration">
      @for (
        paragraph of story().narration;
        track $index
      ) {
        <p>
          {{ paragraph }}
        </p>
      }
    </div>

    <footer class="story-card__footer">
      <div
        class="story-card__pagination"
        aria-label="Történetoldalak"
      >
        @for (
          page of [].constructor(story().pageCount);
          track $index
        ) {
          <span
            class="story-card__page-dot"
            [class.story-card__page-dot--active]="
              $index + 1 === story().currentPage
            "
          ></span>
        }
      </div>

      <button
        type="button"
        class="story-card__next"
        aria-label="Következő történetrész"
      >
        <span aria-hidden="true">
          ›
        </span>
      </button>
    </footer>
  </section>
</article>
