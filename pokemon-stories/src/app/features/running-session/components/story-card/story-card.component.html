<article
  class="story-card"
  [attr.data-mood]="story().mood"
>
  <div class="story-card__image-frame">
    <img
      class="story-card__image"
      [src]="story().imageUrl"
      [alt]="story().imageAlt"
    >
  </div>

  <div class="story-card__content">
    <p class="story-card__eyebrow">Aktuális helyszín</p>
    <h2>{{ story().locationName }}</h2>
    <p class="story-card__narration">
      {{ story().narration }}
    </p>
  </div>
</article>
